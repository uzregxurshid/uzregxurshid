<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg-card { fill: #0a0d14; stroke: #1e2638; stroke-width: 2px; rx: 12px; }
      .text-title { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: bold; fill: #00f0ff; }
      .text-label { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #ffe600; }
      .text-val   { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #f0f4fc; }
      .text-ascii { font-family: monospace; font-size: 13px; fill: #ff007f; white-space: pre; }
      .color-bar  { font-size: 16px; }
    </style>
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="630" height="300" class="bg-card" filter="url(#neon-glow)" />

  <!-- ASCII Cyberpunk Emblem -->
  <g transform="translate(30, 45)" class="text-ascii">
    <text x="0" y="20">     /\_/\    </text>
    <text x="0" y="40">    ( o.o )   </text>
    <text x="0" y="60">     &gt; ^ &lt;    </text>
    <text x="0" y="90">  /=========\ </text>
    <text x="0" y="110"> | CYBER-OS | </text>
    <text x="0" y="130">  \=========/ </text>
    <text x="0" y="160">  [ONLINE v2] </text>
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="35" x2="200" y2="285" stroke="#1e2638" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Neofetch Information Block -->
  <g transform="translate(225, 45)">
    <text x="0" y="15" class="text-title">developer@retro-terminal</text>
    <line x1="0" y1="25" x2="380" y2="25" stroke="#ff007f" stroke-width="2" />

    <text x="0" y="55" class="text-label">OS:</text>
    <text x="80" y="55" class="text-val">Retro-OS x86_64 (Linux Kernel 6.5)</text>

    <text x="0" y="80" class="text-label">HOST:</text>
    <text x="80" y="80" class="text-val">GitHub Profile Engine v2.4</text>

    <text x="0" y="105" class="text-label">UPTIME:</text>
    <text x="80" y="105" class="text-val">99.99% Continuous Crafting</text>

    <text x="0" y="130" class="text-label">SHELL:</text>
    <text x="80" y="130" class="text-val">zsh 5.9 (cyberpunk-theme)</text>

    <text x="0" y="155" class="text-label">SKILLS:</text>
    <text x="80" y="155" class="text-val">TypeScript, Python, Go, React, Docker</text>

    <text x="0" y="180" class="text-label">EDITOR:</text>
    <text x="80" y="180" class="text-val">Neovim / VS Code (Retro CRT)</text>

    <text x="0" y="210" class="color-bar">
      <tspan fill="#00f0ff">███</tspan>
      <tspan fill="#ff007f">███</tspan>
      <tspan fill="#ffe600">███</tspan>
      <tspan fill="#00ff66">███</tspan>
      <tspan fill="#ff4d4d">███</tspan>
      <tspan fill="#ffffff">███</tspan>
    </text>
  </g>
</svg>
